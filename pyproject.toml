[project]
name = "pypsa-invopt"
version = "0.1.0a1"
description = "Inverse-OPF simulator-calibration layer for PyPSA — recovers bid-cost vectors from observed market data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Nima Bahrami" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # Core modeling
    "pypsa>=0.26",
    "highspy>=1.5",
    # Numerics
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
mcmc = [
    "pymc>=5.0",
    "arviz>=0.16",
]
entso_e = [
    "entsoe-py>=0.6",
]
all = [
    "pypsa-invopt[mcmc]",
    "pypsa-invopt[entso_e]",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "nbformat>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pypsa_invopt"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Allow Greek letters (theta sigma mu lambda nu) + euro sign in
# docstrings / strings / comments — they're mathematical notation
# in an inverse-OPF package, not "ambiguous unicode" bugs.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
# Pragmatic mode for v0.1: type hints are encouraged but not enforced
# strictly (pypsa itself is partly untyped, so strict mypy here would
# mean lots of Any-propagation theatre). Tighten in v0.2.
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
